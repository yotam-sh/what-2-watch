# Production deploy — TrueNAS SCALE, "Custom App" via **Docker Compose**
# (not the plain install-form UI). Pulls the image already published by
# .github/workflows/publish.yml; this file intentionally has no `build:` —
# the NAS should never need a Node/native-toolchain build environment just
# to run this app, and a pull is the whole point of publish.yml existing.
#
# TrueNAS mount lesson (hard-won — see
# ../stark-agent/.dashboard/README.md for the fuller story of the same
# issue on a different app): **single-file host-path mounts are unreliable
# on TrueNAS** — they can silently resolve to the wrong or empty content.
# Mount directories only. `./data` below is already a directory, so it's
# fine as-is; if you ever add a mount, keep it a directory too, even if
# that means mounting a folder that holds just one file.

# PORTAINER NOTE: this file deliberately uses `environment:` with ${VAR}
# substitution rather than `env_file: .env`. Portainer's stack editor has no
# `.env` beside the compose file (stacks live in Portainer's own storage and
# its UI variables are written to `stack.env`), so `env_file: .env` fails
# there outright. Substitution works in both worlds: Portainer supplies the
# values from its "Environment variables" panel, and `docker compose` on a
# shell auto-loads a neighbouring `.env` for the same purpose. Set the same
# key/value pairs either way.

services:
  app:
    image: yotamshavit/what-to-watch:latest
    environment:
      # Required — the app fail-fasts at boot if any is missing/invalid.
      - SERVER_ENCRYPTION_KEY=${SERVER_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Must be "true" in production: the tunnel terminates TLS, and without
      # this the browser silently drops the session cookie — login appears to
      # succeed and never persists, with nothing in any log.
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      # Optional Tautulli enrichment is deliberately NOT listed here. Its vars
      # are validated as "absent or non-empty", so passing an empty string
      # (what an unset ${TAUTULLI_URL} would expand to) fails startup. Add
      # both lines only if you actually run Tautulli.
    volumes:
      # Directory mount (see the TrueNAS note above) — holds the
      # SQLCipher-encrypted app.db (+ -wal/-shm). SERVER_ENCRYPTION_KEY
      # (an env var, NOT in this directory) is what actually protects it; see
      # README.md "Backups" before you back this up or move hosts.
      #
      # Set DATA_PATH to an ABSOLUTE path on your pool — e.g.
      # /mnt/tank/apps/what-to-watch/data. Under Portainer a relative path
      # resolves inside Portainer's own storage, where the database is awkward
      # to find and easy to miss in a snapshot. The ./data default exists only
      # for running this file from a shell in the repo.
      - ${DATA_PATH:-./data}:/app/data
    restart: unless-stopped
    # No `ports:` here — this is deliberate, not a forgotten mapping. The
    # app is never reachable directly on the host or LAN; every request
    # arrives through the `cloudflared` tunnel below, which reaches this
    # container over the compose network's internal DNS (`http://app:3000`,
    # matching `EXPOSE 3000` in the Dockerfile). Publishing a host port here
    # would quietly reopen the exact inbound-port exposure the tunnel
    # exists to avoid — see the master plan, "Exposure: Cloudflare Tunnel +
    # Access; no ports opened on the NAS."

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # From the Cloudflare Zero Trust dashboard: Networks > Tunnels >
      # Create a tunnel > Docker (the "connector" token, a long string
      # cloudflared decodes itself — not an API token). Put it in .env,
      # never inline here; see README.md "Cloudflare Tunnel setup".
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
